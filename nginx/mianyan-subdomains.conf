# ==================== zimingji 自我说明书 H5 ====================
server {
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/mianyan.xin/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mianyan.xin/privkey.pem;
    server_name zimingji.mianyan.xin;

    include /opt/jianfeidazi/nginx/security.conf;

    location = /personal {
        alias /var/www/zimingji-h5/personal;
        default_type text/html;
        charset utf-8;
    }
    location = /privacy.html {
        alias /var/www/zimingji-h5/privacy.html;
        charset utf-8;
    }
    location = /agreement.html {
        alias /var/www/zimingji-h5/agreement.html;
        charset utf-8;
    }
    location = /about.html {
        alias /var/www/zimingji-h5/about.html;
        charset utf-8;
    }
    location = /cancel.html {
        alias /var/www/zimingji-h5/cancel.html;
        charset utf-8;
    }
    location / {
        alias /var/www/zimingji-h5/;
        charset utf-8;
    }
}



# ==================== zimingji API ====================
server {
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/mianyan.xin/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mianyan.xin/privkey.pem;
    server_name api.zimingji.mianyan.xin;

    include /opt/jianfeidazi/nginx/security.conf;

    # 上传文件大小限制
    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}


# ==================== HTTP → HTTPS 跳转 ====================
# 注意保留 security.conf 中的 /.well-known/acme-challenge/ 用于证书自动续期
server {
    listen 80;
    server_name fit.mianyan.xin api.fit.mianyan.xin test.fit.mianyan.xin api.test.fit.mianyan.xin zimingji.mianyan.xin api.zimingji.mianyan.xin;

    include /opt/jianfeidazi/nginx/security.conf;

    location / {
        return 301 https://$host$request_uri;
    }
}
