# mianyan.xin 子域名规划
# 主站 mianyan.xin 由 sites-enabled/jianfeidazi 默认 server 承载（/ 为静态主页）
# 本文件承载应用子域名：fit.mianyan.xin（H5/协议页/后台）、api.fit.mianyan.xin（正式 API）

# ==================== fit 应用 ====================
server {
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/mianyan.xin/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mianyan.xin/privkey.pem;
    server_name fit.mianyan.xin;

    include /opt/jianfeidazi/nginx/security.conf;

    # 协议页：独立静态 HTML，无需 JS，供应用市场/微信审核直接访问
    # 注意：URL 无后缀，nginx 无法按扩展名推断类型，需显式声明 text/html，否则浏览器会触发下载
    location = /privacy {
        alias /var/www/fit-h5/static/privacy/privacy_policy.html;
        default_type text/html;
        charset utf-8;
    }
    location = /agreement {
        alias /var/www/fit-h5/static/privacy/user_agreement.html;
        default_type text/html;
        charset utf-8;
    }
    # 带后缀的等价地址：个别浏览器缓存了旧的响应头时可用此地址
    location = /privacy.html {
        alias /var/www/fit-h5/static/privacy/privacy_policy.html;
        charset utf-8;
    }
    location = /agreement.html {
        alias /var/www/fit-h5/static/privacy/user_agreement.html;
        charset utf-8;
    }
    # 注销协议为 SPA 内页面（hash 路由），302 跳转过去
    location = /delete-account {
        return 302 /h5/#/pages/user/delete-account-agreement;
    }

    # 管理后台
    location = /admin {
        return 301 /admin/;
    }
    location /admin/ {
        alias /var/www/fit-admin/;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }

    # 后台上传的静态资源（徽章、图片等）代理到 API 服务
    location /static/ {
        proxy_pass https://api.fit.mianyan.xin/static/;
        proxy_http_version 1.1;
        proxy_set_header Host api.fit.mianyan.xin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }

    # H5 应用（构建产物 base 固定为 /h5/，根路径仅做入口跳转）
    location = / {
        return 302 /h5/;
    }
    location /h5/ {
        alias /var/www/fit-h5/;
        index index.html;
        try_files $uri $uri/ /h5/index.html;
    }
}

# ==================== fit 正式 API ====================
server {
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/mianyan.xin/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mianyan.xin/privkey.pem;
    server_name api.fit.mianyan.xin;

    include /opt/jianfeidazi/nginx/security.conf;
    # 上传文件大小限制
    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }
}

# ==================== fit 测试环境 ====================
# 测试版 H5/后台的构建 base 固定为 /test-h5、/test-admin，此处沿用相同路径
server {
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/mianyan.xin/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mianyan.xin/privkey.pem;
    server_name test.fit.mianyan.xin;

    include /opt/jianfeidazi/nginx/security.conf;

    location = / {
        return 302 /test-h5/;
    }

    location = /test-h5 {
        return 301 /test-h5/;
    }
    location /test-h5/ {
        alias /var/www/fit-h5-test/;
        index index.html;
        try_files $uri $uri/ /test-h5/index.html;
    }

    location = /test-admin {
        return 301 /test-admin/;
    }
    location /test-admin/ {
        alias /var/www/fit-admin-test/;
        index index.html;
        try_files $uri $uri/ /test-admin/index.html;
    }

    location /test-api/ {
        proxy_pass http://127.0.0.1:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }
}

