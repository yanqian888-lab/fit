# 减肥搭子 H5 静态站点 Nginx 配置
# 建议域名：h5.fitapp.com

server {
    listen 80;
    server_name h5.fitapp.com;

    root /var/www/fit-h5;
    index index.html;

    include /opt/jianfeidazi/nginx/security.conf;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
