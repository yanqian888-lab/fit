# 通用 Nginx 安全加固（建议在 server 块内 include）

# 隐藏 Nginx 版本号
server_tokens off;

# 允许 Let's Encrypt HTTP 验证（必须放在禁止隐藏目录规则之前）
location ^~ /.well-known/acme-challenge/ {
    allow all;
    default_type "text/plain";
}

# 禁止访问隐藏目录与文件（.git、.env、.DS_Store 等）
location ~ /\. {
    deny all;
    access_log off;
    log_not_found off;
}

# 禁止下载日志、数据库、备份、临时文件
location ~* \.(log|db|sql|ini|env|bak|backup|old|swp|gitignore)$ {
    deny all;
    access_log off;
    log_not_found off;
}

# 基础安全响应头
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
