# 正式环境后端 API Nginx 配置（HTTPS 版）
# 建议域名：api.fitapp.com
# 使用前请替换为你的真实域名，并配置 SSL 证书

server {
    listen 80;
    server_name api.fitapp.com;

    # HTTP 自动跳转 HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.fitapp.com;

    client_max_body_size 20M;

    # SSL 证书路径（推荐使用 Let's Encrypt / Certbot 申请）
    ssl_certificate /etc/letsencrypt/live/api.fitapp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.fitapp.com/privkey.pem;

    # SSL 安全加固
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 安全加固（隐藏版本号、禁止访问敏感文件等）
    include /opt/jianfeidazi/nginx/security.conf;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# Certbot 申请证书命令示例（需先安装 certbot 和 python3-certbot-nginx）：
# sudo certbot --nginx -d api.fitapp.com
#
# 申请成功后，证书会自动写入 /etc/letsencrypt/live/api.fitapp.com/
# 并自动修改本文件。建议备份此文件后再执行 certbot。
