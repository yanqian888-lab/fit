# 掉秤搭搭 测试环境后端 API
# https://api.test.fit.mianyan.xin → 127.0.0.1:3001
# 证书：Let's Encrypt（覆盖 mianyan.xin 及子域名，自动续期）

server {
    listen 80;
    server_name api.test.fit.mianyan.xin;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.test.fit.mianyan.xin;

    client_max_body_size 20M;

    ssl_certificate /etc/letsencrypt/live/mianyan.xin/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mianyan.xin/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    include /opt/jianfeidazi/nginx/security.conf;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
