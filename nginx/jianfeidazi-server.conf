server {
    listen 80;
    server_name _;

    include /opt/jianfeidazi/nginx/security.conf;

    location = /admin {
        return 301 /admin/;
    }

    location /admin/ {
        alias /var/www/fit-admin/;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }

    location = /h5 {
        return 301 /h5/;
    }

    location /h5/ {
        alias /var/www/fit-h5/;
        index index.html;
        try_files $uri $uri/ /h5/index.html;
    }

    location = /test-admin {
        return 301 /test-admin/;
    }

    location /test-admin/ {
        alias /var/www/fit-admin-test/;
        index index.html;
        try_files $uri $uri/ /test-admin/index.html;
    }

    location = /test-h5 {
        return 301 /test-h5/;
    }

    location /test-h5/ {
        alias /var/www/fit-h5-test/;
        index index.html;
        try_files $uri $uri/ /test-h5/index.html;
    }

    location = /h5/index.html {
        alias /var/www/fit-h5/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    location = /test-h5/index.html {
        alias /var/www/fit-h5-test/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    location = /admin/index.html {
        alias /var/www/fit-admin/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    location = /test-admin/index.html {
        alias /var/www/fit-admin-test/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    location /h5/static/ {
        alias /var/www/fit-h5/static/;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    location /test-h5/static/ {
        alias /var/www/fit-h5-test/static/;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # 注意：不要再配置全局 /static/ 目录。
    # 测试/正式环境的静态资源已经分别放在 /var/www/fit-h5-test/static/
    # 和 /var/www/fit-h5/static/，并通过上面的 /test-h5/static/ 与 /h5/static/
    # location 提供服务，避免互相覆盖。

    location /test-api/ {
        proxy_pass http://127.0.0.1:3001/;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }
}
